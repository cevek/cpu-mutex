# ubuntu exercises the flock branch, macos the lockf branch — the two utilities differ in flags,
# exit codes and timeout parsing, and a dev machine only ever runs one of them. The node-version
# matrix runs on ubuntu only, and macos is a single job: macOS minutes bill at 10x on private
# repos (free and unlimited once the repo is public), and the lockf/flock split does not vary by
# node version.
#
# GitHub sets CI=true, under which the wrapper itself takes no lock by design; the test suite is
# immune (fixtures strip CI and force CPU_MUTEX=1), so the suite asserts the same behavior here as
# locally. No windows job: runs are unlocked there until Windows support lands.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: node ${{ matrix.node }} · ubuntu · flock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  macos:
    name: node 22 · macos · lockf
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  bash-as-sh:
    # Fedora/RHEL/Arch link /bin/sh to bash, which unlike dash survives a failed redirection on
    # `:` — the sentinel guard (`|| exit 66`) exists for exactly that shell, so the whole suite
    # runs under it once.
    name: node 22 · ubuntu · bash as /bin/sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo ln -sf /bin/bash /bin/sh
      - run: npm ci
      - run: npm test
